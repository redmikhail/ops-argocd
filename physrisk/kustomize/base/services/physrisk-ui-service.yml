kind: Service
apiVersion: v1
metadata:
  name: physrisk-ui
  labels:
    app: physrisk-ui
    app.kubernetes.io/component: physrisk-ui
    app.kubernetes.io/name: physrisk-ui
    app.kubernetes.io/part-of: physrisk
spec:
  ports:
    - name: 8080-tcp
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: 8443-tcp
      protocol: TCP
      port: 8443
      targetPort: 8443
  selector:
    app: physrisk-ui
